services:
  db:
    image: postgres:16-alpine
    container_name: ruian-postgres
    environment:
      POSTGRES_DB: ruian_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruian_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  importer:
    build: .
    container_name: ruian-importer
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ruian_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

volumes:
  pgdata: